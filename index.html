<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melu Home｜家族専属AI秘書</title>
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #FFF7F0; --card: #FFFFFF; --text: #3B2F28; --sub: #9C8B7E; --accent: #F28C28; --line: #F1E4D8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1F1A17; --card: #2A2420; --text: #F3EAE2; --sub: #B4A79C; --accent: #F5A04A; --line: #3A322C; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif; line-height: 1.8; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  header img { width: 48px; height: 48px; border-radius: 12px; }
  header a { color: inherit; text-decoration: none; font-weight: bold; font-size: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 24px 20px; }
  h1 { font-size: 24px; margin: 0 0 16px; }
  h2 { font-size: 17px; margin: 28px 0 4px; }
  p { margin: 8px 0; overflow-wrap: anywhere; }
  a { color: var(--accent); }
  nav { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 24px; font-size: 14px; }
  footer { margin-top: 32px; color: var(--sub); font-size: 13px; }
</style>
</head>
<body>
<main>
<header><img src="icon.png" alt=""><a href="./">Melu Home</a></header>
<div class="card">
<h1>Melu Home｜家族専属AI秘書</h1>
<p>学校や園のプリント、家族の予定、やることを、AI秘書の「メル」がまとめて覚えておくアプリです。プリントの写真を送るだけで予定と持ち物を読み取り、締切の前にお知らせします。</p>
<h2>お問い合わせ・サポート</h2>
<p>使い方のご質問、不具合のご報告、アカウントの削除のご依頼などは、<a href="mailto:support@meluhome.com">support@meluhome.com</a> までご連絡ください。</p>
<p>アカウントの削除は、アプリの「設定」からも行えます。</p>

<p>株式会社オーレリア（大阪府）</p>
